<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Slate Background Gradient -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Slate Pencil Body Gradient -->
    <linearGradient id="pencilLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="pencilDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Tip Cone Gradient -->
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Chalk Text Gradient -->
    <linearGradient id="chalkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Electric Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Slate Tablet Base (സ്ലേറ്റ്) -->
  <rect width="512" height="512" rx="112" fill="url(#slateGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />
  
  <!-- Subtle Inner Slate Texture Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- 2. Ambient Slate Glow -->
  <circle cx="210" cy="240" r="140" fill="#0ea5e9" opacity="0.08" filter="url(#softGlow)" />

  <!-- 3. Written Letter "ക" (First letter of Malayalam & Kallu Pencil) -->
  <!-- Subtle Drop Shadow -->
  <text x="206" y="322" font-family="'Manjari', 'Noto Sans Malayalam', 'Nirmala UI', 'Kartika', sans-serif" font-size="240" font-weight="900" fill="#000000" opacity="0.45" text-anchor="middle">ക</text>
  <!-- Chalk Letter Body -->
  <text x="204" y="318" font-family="'Manjari', 'Noto Sans Malayalam', 'Nirmala UI', 'Kartika', sans-serif" font-size="240" font-weight="900" fill="url(#chalkGrad)" text-anchor="middle" filter="url(#cyanGlow)">ക</text>

  <!-- 4. The Slate Pencil (കല്ലുപെൻസിൽ) -->
  <g transform="translate(365, 140) rotate(-42)">
    <!-- Shadow beneath pencil -->
    <rect x="-18" y="-120" width="36" height="150" rx="6" fill="#000000" opacity="0.35" transform="translate(10, 10)" />

    <!-- Pencil Body (Light / Highlight Side) -->
    <path d="M -16,-120 L 0,-120 L 0,30 L -16,30 Z" fill="url(#pencilLight)" />
    <!-- Pencil Body (Shaded Side) -->
    <path d="M 0,-120 L 16,-120 L 16,30 L 0,30 Z" fill="url(#pencilDark)" />
    <!-- Top Cap (Rounded end of slate pencil) -->
    <ellipse cx="0" cy="-120" rx="16" ry="6" fill="#f8fafc" />

    <!-- Sharpened Cone Tip (കല്ലുപെൻസിൽ ചെത്തിയത്) -->
    <polygon points="-16,30 0,72 16,30" fill="url(#tipGrad)" />
    <polygon points="0,30 0,72 16,30" fill="rgba(0,0,0,0.18)" />

    <!-- Lead / Writing Point -->
    <polygon points="-5,58 0,73 5,58" fill="#38bdf8" />
    <circle cx="0" cy="73" r="5" fill="#ffffff" filter="url(#cyanGlow)" />
  </g>

  <!-- 5. Chalk Dust / Sparkle Particle at Writing Tip -->
  <circle cx="316" cy="192" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="304" cy="178" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="330" cy="205" r="2.5" fill="#38bdf8" opacity="0.7" />

  <!-- 6. Brand Name Subtitle -->
  <g transform="translate(256, 436)">
    <!-- English Kallu Pencil -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="5">KALLU PENCIL</text>
    <!-- Malayalam Name -->
    <text x="0" y="32" font-family="'Manjari', 'Noto Sans Malayalam', 'Nirmala UI', sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">കല്ലുപെൻസിൽ</text>
  </g>
</svg>
